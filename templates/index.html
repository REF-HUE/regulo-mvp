<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regulo - Property Zoning Intelligence</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>REGULO</h1>
            <p class="tagline">Know what you can build before you design</p>
        </div>
        
        <div class="search-box">
            <form action="/search" method="POST">
                <input 
                    type="text" 
                    name="search_query" 
                    placeholder="Enter stand number or address (e.g., 123, Bryanston, Industrial)"
                    required
                    autofocus
                >
                <button type="submit">Search Property</button>
            </form>
        </div>
        
        <div class="info-text">
            <p>🔍 Currently covering City of Johannesburg properties</p>
            <p>💡 Try: 123, 456, 789, Bryanston, Sandton, Rosebank, Fourways, Midrand</p>
        </div>
    </div>
</body>
</html>
